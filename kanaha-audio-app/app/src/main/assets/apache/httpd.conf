# Apache httpd Configuration for Kanaha Audio
# HTTP/2 + mTLS Audio Search Server (Path B: real Apache + mod_http2 + mod_axis2)
#
# This replaces the previous hand-rolled OpenSSL HTTP/1.1 server
# (apache_httpd_android.c) with the same real-Apache stack the Kanaha Camera
# app uses, so AudioSearchService is served over genuine HTTP/2 (ALPN h2).
#
# NOTE: This httpd binary has modules statically linked:
#   - mod_ssl, mod_http2, mod_authz_core, mod_dir, mod_mime,
#   - mod_log_config, mod_headers, mod_setenvif, mod_reqtimeout, mod_unixd
#   - mod_axis2 (with AudioSearchService statically linked — see PATH_B doc)
# No LoadModule directives needed for these modules.

# ServerRoot is set via -d command line argument
PidFile "logs/httpd.pid"
ErrorLog "logs/error_log"
LogLevel info

# Listen on HTTPS port 8443 (non-privileged for Android; cannot bind 443)
Listen 8443

# Server identification (substituted by AudioService at deploy time)
ServerName {{KANAHA_HOSTNAME}}:8443
ServerAdmin admin@kanaha.local

DocumentRoot "htdocs"
<Directory "htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex index.html index.htm

TypesConfig conf/mime.types
AddDefaultCharset UTF-8

# HTTP/2 over TLS (ALPN). Real h2 — verify with:
#   curl -v --http2 ... | grep -i ALPN   (expect "server accepted h2")
Protocols h2 http/1.1
H2Direct on
H2Push off

# SSL/TLS + mTLS (server cert + required client cert) — see ssl.conf
# NOT wrapped in <IfModule mod_ssl.c>: if mod_ssl is somehow absent from the
# binary, the server must fail to start rather than come up in cleartext with
# no client-cert requirement. Same reasoning for axis2 below.
Include conf/ssl.conf

# HTTP/2 performance + HTTP/2 Bomb (CVE-2026-49975) hardening
<IfModule mod_http2.c>
    Include conf/http2-performance.conf
</IfModule>

# Axis2/C — AudioSearchService (searchKeywords, etc.)
Include conf/axis2.conf

# Security headers
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# ========================================================================
# Request limits / DoS protection (carried over from the previous server,
# and the per-request blast-radius bound for the HTTP/2 Bomb: cookie crumbs
# bypass LimitRequestFields until mod_http2 >= 2.0.41, but LimitRequestFieldSize
# caps the merged Cookie and so the crumb count per stream).
# ========================================================================
# Search requests carry a filename + keyword list; 64KB is generous.
LimitRequestBody 65536
LimitRequestFieldSize 4096
LimitRequestFields 50
LimitRequestLine 4096
Timeout 30

<IfModule mod_reqtimeout.c>
    RequestReadTimeout header=10-20,MinRate=500
    RequestReadTimeout body=10-30,MinRate=1000
</IfModule>

# Block known scanning/attack user agents (carried over from prior config)
<IfModule mod_setenvif.c>
    SetEnvIfNoCase User-Agent "burp" blocked_ua=1
    SetEnvIfNoCase User-Agent "zap" blocked_ua=1
    SetEnvIfNoCase User-Agent "nikto" blocked_ua=1
    SetEnvIfNoCase User-Agent "sqlmap" blocked_ua=1
    SetEnvIfNoCase User-Agent "nmap" blocked_ua=1
    SetEnvIfNoCase User-Agent "masscan" blocked_ua=1
    SetEnvIfNoCase User-Agent "nuclei" blocked_ua=1
    SetEnvIf User-Agent "^$" blocked_ua=1
    <Location "/">
        <RequireAll>
            Require all granted
            Require not env blocked_ua
        </RequireAll>
    </Location>
</IfModule>

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "logs/access_log" combined

# mTLS audit log — client cert identity per request
LogFormat "%t|%h|%{SSL_CLIENT_S_DN}x|%{SSL_CLIENT_VERIFY}x|\"%r\"|%>s|%b" mtls_audit
CustomLog "logs/audit.log" mtls_audit

ErrorDocument 500 "Internal Server Error - Audio Service Unavailable"
ErrorDocument 403 "Access Forbidden - Valid Client Certificate Required"
ErrorDocument 404 "Not Found - Audio Service Endpoint Not Available"

KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Worker MPM — threads enable HTTP/2 multiplexing; minimal for Android.
<IfModule mpm_worker_module>
    StartServers          1
    MinSpareThreads       1
    MaxSpareThreads       4
    ThreadsPerChild       4
    MaxRequestWorkers     16
    MaxConnectionsPerChild 0
</IfModule>
