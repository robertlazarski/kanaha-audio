# HTTP/2 Performance + HTTP/2 Bomb (CVE-2026-49975) hardening for Kanaha Audio
# Conservative configuration for Android single-process mode (-X flag).
#
# Mirrors the Kanaha Camera app. The CVE-2026-49975 "HTTP/2 Bomb" chains an
# HPACK indexed-reference bomb (cheap headers that each cost a full server
# allocation) with a zero-window flow-control stall that pins that memory. On a
# phone's tight RAM budget these caps matter; the real fix is mod_http2 >= 2.0.41.

<IfModule http2_module>
    Protocols h2 http/1.1
    H2Direct on

    # Cap concurrent streams per connection. The bomb amplifies per stream, so a
    # low cap bounds the per-connection blast radius. 1 also avoids multiplexing
    # hangs on single-process Android (matches the camera app).
    H2MaxSessionStreams 1

    # Bound how long a zero-window-stalled stream may live.
    H2StreamTimeout 30

    # Cap per-stream outgoing buffer so a stalled response can't pin much RAM.
    H2StreamMaxMemSize 65536

    # Smaller flow-control window -> lower per-stream memory.
    H2WindowSize 65535

    # Server push not needed for JSON-RPC.
    H2Push off
    H2Upgrade on

    # Limit workers for single-process mode.
    H2MinWorkers 1
    H2MaxWorkers 2
</IfModule>

Timeout 30
SSLSessionCacheTimeout 60

<IfModule headers_module>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
</IfModule>
