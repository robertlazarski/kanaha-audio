# SSL / mTLS Configuration for Kanaha Audio
# Mutual TLS: server presents a cert AND requires a valid client cert.
# Shares the same CA as the Kanaha Camera app (identical ca.crt), so the
# camera's client.crt (CN=kanaha-control) authenticates here too.

SSLEngine on
SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder     off
SSLSessionTickets       off
SSLUseStapling          off

# Server certificate (deployed from assets/ssl by AudioService)
SSLCertificateFile      "ssl/server.crt"
SSLCertificateKeyFile   "ssl/server.key"

# CA used to validate client certificates (mTLS)
SSLCACertificateFile    "ssl/ca.crt"

# NOTE: no CRL shipped for the audio app (camera uses ssl/ca.crl). If you add
# revocation, deploy ssl/ca.crl and re-enable:
#   SSLCARevocationFile  "ssl/ca.crl"
#   SSLCARevocationCheck chain

SSLVerifyClient         require
SSLVerifyDepth          10
SSLOptions              +StrictRequire

<VirtualHost *:8443>
    ServerName {{KANAHA_HOSTNAME}}:8443
    DocumentRoot "htdocs"

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile      "ssl/server.crt"
    SSLCertificateKeyFile   "ssl/server.key"
    SSLCACertificateFile    "ssl/ca.crt"
    SSLVerifyClient require
    SSLVerifyDepth  10

    # AudioSearchService (and any other Axis2/C services)
    <Location "/services">
        SSLRequireSSL
        SSLVerifyClient require
        Require all granted
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </Location>

    ErrorLog "logs/ssl_error_log"
    CustomLog "logs/ssl_access_log" \
        "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b \"%{SSL_CLIENT_S_DN}x\""
    LogLevel warn ssl:info

    SSLSessionCacheTimeout  300
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>

SSLInsecureRenegotiation off
SSLCompression off
SSLOptions +StdEnvVars +ExportCertData
